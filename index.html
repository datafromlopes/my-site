<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/media/profile.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..600&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <link rel="alternate" type="application/rss+xml" title="Diego Lopes — Writing" href="/rss.xml" />

    <!-- Replaced per route by scripts/prerender.mjs; this is what `npm run dev` shows. -->
    <title>Diego Lopes — Lead Data Engineer &amp; NLP Researcher</title>

    <!--app-head-->

    <script>
      // Apply the stored theme before first paint so the page never flashes.
      ;(function () {
        // Signals that scripting is available; scroll reveals opt in on this.
        document.documentElement.classList.add('js')
        try {
          var stored = localStorage.getItem('dfl-theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {}
      })()
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
